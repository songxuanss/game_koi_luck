schema: spec-driven

# 项目上下文：Goal v1.2（2026-10-16 agent 优化草案，待人 L3 签署；修订记录见 docs/GOAL-阶段计划.md 末尾）与硬约束 —— 所有 OpenSpec 变更的准入校验基准
# 完整阶段细化见 docs/GOAL-阶段计划.md；调研依据见 docs/立项调研与总体方案.md (v0.7)
context: |
  # 北极星
  在法律与平台合规红线内，用《幸运锦鲤》（无人自动弹幕玩法）验证
  "零真人主播的礼物驱动玩法"商业模型是否成立。

  # 成功标准 G3（T0+6月；T0=首个平台提案通过日）
  - S1 首发平台全量上线，稳定房间 >=20（稳定=周开播>=5天且日均>=4h；自运营号<=3计入）
    首发平台 = 抖音；若快手提案先通过（T0 由快手触发），首发平台即为快手——指标只计首发平台
  - S2 首发平台周日均流水 >=2万（含自运营号；第二平台流水另记不混入；
    口径对齐抖音基础任务金门槛，方案 7.3）
    一致性校验：20 房间 x 挂机单间 300~600 元 + 3 自运营号 x 1400 元 ≈ 1.0~1.6 万 < 2 万
    -> S2 需约 30+ 房间或单间 >=800 元；G2 后第 4 周按实测复核 S1/S2 配比（不达则黄灯）
  - S3 三假设实验出结论并落地：H1 无人间流量天花板 / H2 无真人付费转化 / H3 反催氪流水上限

  # 中间门
  - G1 立项门：提案至少一平台通过 + 7天流量实测 + TTS选型（T0 由此起算）
  - G2 上线门：T0+3~4月，首发平台全量 + 首月20房间（1人+agent 生产，AI 美术管线，Auto-Host最小v1）

  # 正规渠道交付件（D，2026-10-16 新增）
  - D1 软著登记：材料包（源代码60页/说明书60页/申请表/非职务开发保证书）由 agent 生成，
    人做一致性终审（L3）后提交；走加急通道；证书最晚于官方提审上架前取得
  - D2 开放平台入驻：抖音（首发）+ 快手（备援）个人开发者实名入驻通过
  - D3 玩法提案：提案文档过平台评审（含数值附录+无人模式合规说明）
  - 详见 docs/正规渠道申请指南.md（分步操作手册）

  # Guardrails（不可协商；Pivot 触发时须显式修订为 change，不得默默违反）
  - R1 法律+平台规则双层底线；随机产出不可交易写入代码级约束
  - R2 反催氪七原则；催氪红线进词表系统（禁消费指令/金额播报/对比羞辱）
  - R3 零真人主播依赖（Auto-Host 全自动）
  - R3b 民间快速路线纪律（2026-10-16 拍板，短期采用）：抓取工具+直播伴侣路线仅限
    验证期使用——自播（可弃置测试号）+ 熟人主播 ≤5 个复测（不抽成/象征性）；
    主号与未来报白号绝不沾染（挂非官方玩法处罚留案底，影响报白准入）；
    不做中心化数据收集、不做地下发行商；规模化分发只走官方（D1-D3 交付后）
    ⚠ 与方案 2.5"第三方抓取工具违规，弃用"直接冲突——R3b 是对 R1"平台规则层"的有意、限时例外，
    由人拍板承担；例外边界：仅 V0、T0 后停用、local-grab 代码不进软著材料、不进官方提审包
    ⚠ V0 数据效力：测试号无玩法分发入口/幸运魔方/任务金，H1（流量）结论只作方向参考，
    不得替代内测 H1；V0 主要产出 = 真实事件流样本 + H2 方向性数据 + 引擎调参
  - R4 预算 15 万硬顶——超支砍功能不追加

  # 退出规则（三级灯）
  - 黄灯：G2后第4周 周日均<4,000 或房间周流失>30% -> 干预+2周观察；
    H2专项（内测 TTS A/B 差异<10% 且破冰率<0.5%）-> 立即 Pivot A 评估
  - 红灯：T0+6月 周日均<8,000 且至少一假设否定 -> Pivot A半无人/B生态供给/C换题材，
    同步修订 Goal；Pivot 后 6 周无改善 -> 黑灯
  - 黑灯：连续4周 周日均<2,000 -> 止损评估（关停/打包出售/蛰伏）
  - G1 失败出口：两次提案不过 -> 止损评估；两轮原因不同且明确可修复 -> 第三次（最后机会）

  # 平台与技术基线
  - 平台策略（2026-10-16 用户拍板调整）：**抖音首发**（大盘最大+任务金/幸运魔方/聚光红利；
    无人治理风险首日应对——半无人策略从第一天执行：TTS+BGM+黄金时段真人值班）
    -> 快手次之（无人合规确定性最高，承接自运营双轨）；虎牙/B站在 G3 后另立 goal
  - 技术栈：Cocos Creator 3.8+ (TS) 客户端（原生 exe 唯一构建目标，web 版后置待触发）
    + Node/TS 服务端；Core/Adapter 分离（矩阵留口）
  - 无人模式防封三原则：内容实时性 / 声音层永不静默 / 变化性

  # 生产模式（2026-10-16 拍板）
  - 所有项目产出由 agent 生产（代码/美术/文档/测试/配置），人类仅负责验证、测试与决策
  - 人类专属（agent 不可代劳）：平台注册与协议签署、外部沟通、资金操作、
    合规终审、三级灯/Pivot/止损决策、Goal 修订、上线发布
  - 验证分级 L0(CI自动)/L1(agent交叉)/L2(人抽验)/L3(人全验：合规红线/提审/资金/发布)
  - 瓶颈认知：生产成本趋零，真实瓶颈 = 人类验证吞吐量 + 外部依赖周期

# 按 artifact 的规则 —— 流程细化（需求澄清/技术选型/研发/测试）落于此
rules:
  proposal:
    - 必须对照 Guardrails R1-R4 逐条自检，结论写入提案
    - 必须通过合规三层清单（法律层/平台规则层/反催氪层，方案附录C）逐项检查
    - 必须声明所属阶段门（G1/G2/G3）及与退出规则指标的关联
    - 外显文案必须过安全用词表（禁：抽奖/盲盒/礼盒/游戏/玩家/血条/赛季/BUFF 等）
    - 内部代号 luckyDrawer（=lucky draw，抽奖）禁止出现在任何外显物：软件名/包名/exe 元数据/
      窗口标题/软著源码与说明书/提案；对外统一用"幸运锦鲤"，代码命名空间统一 @jinli
    - 营销与招募文案（主播招募/官方号/社群）同样过词表，且禁止收益承诺（"挂机日赚XX"）
  design:
    - 必须遵循 Core/Adapter 分离：game-core 不得引用任何平台 SDK
    - 随机性只允许模式A（随机外观，全玩法仅一款礼物）或模式B（免费可得的养成资源，3个月保留）
    - 数值设计必须引用方案 5.9 数值框架，改动需说明对三假设实验的影响
    - 热更边界：机制变更必须走版本提审，严禁热更下发
    - 助力值（贡献/榜单计量）与进度（胜负推进）分离：大额档位进度贡献设上限，
      单件礼物不得独立决定胜负（方案 5.9 ⑧）
    - 助力值↔金额换算率不得对外公示或可被稳定反推（否则"零金额显示"名存实亡）
  tasks:
    - 每个任务标注所属阶段（需求澄清/技术选型/研发/测试）与验收标准
    - 单任务粒度 <=2 天；涉及合规红线的任务必须链接方案附录C对应条目
    - 每个任务必须标注验证级别（L0 CI自动 / L1 agent交叉 / L2 人抽验 / L3 人全验）；
      L2/L3 任务必须写明人类的抽验点或全验清单
    - 测试任务必须覆盖：数值正确性（自动化）/ 合规扫描（CI门禁）/ 压测（快手指标）/ 无人长稳
    - change 完成时必须附验证包（自测报告+合规自查+风险声明+验证级别建议），
      无验证包的 change 不得进入人类验收
  specs:
    - 性能规格必须包含"最严超集"压测红线（取快手官方指标，抖音提审要求不低于此）：
    单房间聚合1000qps、全局4200qps、推送P995<1s、渲染>=30fps、逻辑帧>=15fps、内存<=350MB
  - 性能规格必须有对应的测试任务（无任务承接的性能要求须显式标注"后置至测试变更"）
    - 用户可见文案的规格必须声明已过词表过滤
