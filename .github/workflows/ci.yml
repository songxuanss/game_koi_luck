name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run loadtest
      - run: npm run soak
      - run: npm run verify-pack
      - uses: actions/upload-artifact@v4
        with:
          name: verification
          path: artifacts/
          if-no-files-found: error
